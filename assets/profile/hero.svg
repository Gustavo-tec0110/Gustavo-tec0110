<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Gustavo Lopes — Full Stack Developer</title>
  <desc id="desc">An animated terminal-inspired banner for Gustavo Lopes, a Full Stack Developer who builds real-world web applications.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070a12"/>
      <stop offset=".56" stop-color="#11182d"/>
      <stop offset="1" stop-color="#241144"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset=".48" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111a31" stop-opacity=".94"/>
      <stop offset="1" stop-color="#160e2c" stop-opacity=".78"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="72%">
      <stop stop-color="#8b5cf6" stop-opacity=".34"/>
      <stop offset=".56" stop-color="#38bdf8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#a78bfa" stroke-opacity=".11"/>
    </pattern>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typed-command"><rect x="314" y="145" width="0" height="34"><animate attributeName="width" values="0;0;80;80" keyTimes="0;.2;.52;1" dur="4.8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#background)"/>
  <rect width="1200" height="500" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="500" rx="24" fill="url(#glow)"/>
  <rect x="26" y="26" width="1148" height="448" rx="18" fill="#070a12" fill-opacity=".42" stroke="#94a3b8" stroke-opacity=".28"/>
  <circle cx="74" cy="77" r="7" fill="#f87171"/>
  <circle cx="99" cy="77" r="7" fill="#facc15"/>
  <circle cx="124" cy="77" r="7" fill="#4ade80"/>
  <path d="M70 113h270" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="169" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600">gustavo@github:~$</text>
  <text x="314" y="169" fill="#d8b4fe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" clip-path="url(#typed-command)">whoami</text>
  <rect x="396" y="148" width="10" height="25" rx="1" fill="#d8b4fe"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <g>
    <text x="70" y="260" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">Gustavo Lopes</text>
    <text x="70" y="316" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700">Full Stack Developer</text>
    <text x="70" y="367" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">Building real-world web applications across the stack.</text>
  </g>
  <g transform="translate(830 125)">
    <rect width="290" height="238" rx="17" fill="url(#panel)" stroke="#a5b4fc" stroke-opacity=".42"/>
    <rect x="22" y="24" width="246" height="34" rx="8" fill="#080d1b" stroke="#64748b" stroke-opacity=".36"/>
    <circle cx="41" cy="41" r="5" fill="#38bdf8" filter="url(#soft-glow)"/>
    <path d="M57 41h76" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M23 91h244M23 147h244M23 202h244" stroke="#64748b" stroke-opacity=".28"/>
    <g fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(55 91)">
      <path d="M42 0 0 42l42 42"/>
      <path d="m143 0 42 42-42 42"/>
      <path d="m111-18-31 120"/>
    </g>
    <rect x="33" y="174" width="72" height="9" rx="4.5" fill="#38bdf8"/>
    <rect x="116" y="174" width="46" height="9" rx="4.5" fill="#818cf8"/>
    <rect x="173" y="174" width="68" height="9" rx="4.5" fill="#c084fc"/>
  </g>
  <text x="975" y="409" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">frontend / backend / data / delivery</text>
  <path d="M70 439h1060" stroke="url(#accent)" stroke-opacity=".72" stroke-width="2"/>
</svg>
