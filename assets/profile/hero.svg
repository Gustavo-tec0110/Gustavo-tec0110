<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Gustavo Lopes — Full Stack Developer</title>
  <desc id="desc">An animated terminal-inspired hero for Gustavo Lopes, a Full Stack Developer who builds real-world web applications.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080b14"/>
      <stop offset=".58" stop-color="#10162a"/>
      <stop offset="1" stop-color="#20123d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="70%">
      <stop stop-color="#8b5cf6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#a78bfa" stroke-opacity=".11"/>
    </pattern>
    <clipPath id="typed-command"><rect x="304" y="128" width="0" height="32"><animate attributeName="width" values="0;0;78;78" keyTimes="0;.2;.52;1" dur="4.8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1200" height="420" rx="22" fill="url(#background)"/>
  <rect width="1200" height="420" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="22" fill="url(#glow)"/>
  <rect x="28" y="28" width="1144" height="364" rx="16" fill="#070a12" fill-opacity=".46" stroke="#94a3b8" stroke-opacity=".25"/>
  <circle cx="73" cy="75" r="6" fill="#f87171"/>
  <circle cx="95" cy="75" r="6" fill="#facc15"/>
  <circle cx="117" cy="75" r="6" fill="#4ade80"/>
  <path d="M70 106h220" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="154" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600">gustavo@github:~$</text>
  <text x="304" y="154" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" clip-path="url(#typed-command)">whoami</text>
  <rect x="385" y="135" width="10" height="23" rx="1" fill="#c4b5fd"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <g>
    <text x="70" y="231" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800">Gustavo Lopes</text>
    <text x="70" y="279" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Full Stack Developer</text>
    <text x="70" y="327" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="23">Building real-world web applications across the stack.</text>
  </g>
  <g transform="translate(895 145)" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 0 26 56l56 56"/>
    <path d="m178 0 56 56-56 56"/>
    <path d="m144-27-38 166"/>
  </g>
  <text x="870" y="337" fill="#a5b4fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">frontend / backend / data / delivery</text>
  <path d="M70 367h1060" stroke="url(#accent)" stroke-opacity=".72" stroke-width="2"/>
</svg>
